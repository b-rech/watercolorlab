site_name: WatercolorLab
site_description: Processing of ocean color laboratory measurements
site_url: https://b-rech.github.io/watercolorlab/
repo_url: https://github.com/b-rech/watercolorlab
repo_name: b-rech/watercolorlab

theme:
  name: material
  logo: assets/watercolorlab-logo.svg
  favicon: assets/watercolorlab-symbol.svg
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - CDOM processing: user-guide/cdom.md
      - Particulate processing: user-guide/particulate.md
  - Algorithms:
      - CDOM ATBD: cdom_atbd.md
      - Particulate ATBD: particulate_atbd.md
      - Consistency ATBD: consistency_atbd.md
  - API reference: api-reference.md
